<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>:root {color-scheme:dark;}html,body {margin:0;width:100%;height:100%;overflow:hidden;background:#071018;}body {font-family:"Iosevka Term","IBM Plex Mono",monospace;}#terminal-shell {position:relative;box-sizing:border-box;width:100vw;height:100vh;overflow:hidden;font-size:16px;line-height:1.2;background:radial-gradient(circle at top,rgba(29,61,84,0.34),transparent 52%),linear-gradient(180deg,#09111a 0%,#060b11 100%);}#terminal-shell::before {content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(126,194,225,0.05),transparent 28%,transparent 72%,rgba(126,194,225,0.05)),repeating-linear-gradient(180deg,rgba(255,255,255,0.04),rgba(255,255,255,0.04) 1px,transparent 1px,transparent 4px);opacity:0.32;mix-blend-mode:screen;}#terminal-shell[data-state="booting"] #terminal {opacity:0;}#terminal-shell[data-state="booting"] #cursor {display:none !important;}#terminal-shell[data-state="live"] #terminal {opacity:1;}#terminal-shell[data-state="live"] #boot-screen {opacity:0;visibility:hidden;transition:opacity 220ms ease-out,visibility 0s linear 220ms;}#terminal-shell[data-state="failed"] #boot-panel {border-color:rgba(255,126,126,0.42);box-shadow:0 0 0 1px rgba(255,126,126,0.12),0 26px 60px rgba(0,0,0,0.54);}#boot-screen {position:absolute;inset:0;z-index:2;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at center,rgba(15,29,41,0.22),rgba(3,6,10,0.68)),linear-gradient(180deg,rgba(12,24,33,0.8),rgba(5,8,12,0.92));}#boot-panel {position:relative;width:min(540px,100%);box-sizing:border-box;overflow:hidden;padding:24px 26px;border:1px solid rgba(142,205,234,0.28);background:rgba(8,14,20,0.9);box-shadow:0 0 0 1px rgba(255,255,255,0.03),0 26px 60px rgba(0,0,0,0.54);}#boot-panel::before {content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(159,230,255,0.16),transparent);transform:translateX(-100%);animation:boot-sweep 2.6s linear infinite;}#boot-badge {color:#6d9db3;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;}#boot-title-row {display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:12px;}#boot-title {color:#f3fbff;font-size:clamp(32px,7vw,44px);line-height:1;letter-spacing:0.05em;text-transform:uppercase;}#boot-blips {display:flex;gap:6px;}.boot-blip {width:8px;height:8px;border-radius:999px;background:#86d6ff;box-shadow:0 0 12px rgba(134,214,255,0.45);animation:boot-blip 1s ease-in-out infinite;}.boot-blip:nth-child(2) {animation-delay:120ms;}.boot-blip:nth-child(3) {animation-delay:240ms;}#boot-progress {position:relative;height:12px;margin-top:18px;border:1px solid rgba(134,214,255,0.22);background:rgba(13,26,35,0.76);overflow:hidden;}#boot-progress-bar {display:block;width:34%;height:100%;background:linear-gradient(90deg,#58b8e8,#b4ecff,#58b8e8);box-shadow:0 0 24px rgba(88,184,232,0.28);animation:boot-progress 1.7s linear infinite;}#boot-ledger {display:grid;gap:8px;margin-top:18px;color:#8fb4c5;font-size:13px;}.boot-ledger-line {position:relative;padding-left:18px;opacity:0.62;animation:boot-ledger 1.5s ease-in-out infinite;}.boot-ledger-line::before {content:"";position:absolute;left:0;top:50%;width:7px;height:7px;border-radius:999px;background:#7dc9ef;transform:translateY(-50%);box-shadow:0 0 12px rgba(125,201,239,0.4);}.boot-ledger-line:nth-child(2) {animation-delay:180ms;}.boot-ledger-line:nth-child(3) {animation-delay:360ms;}#boot-status {margin-top:20px;color:#ddf7ff;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;}#terminal {position:absolute;inset:0;overflow:hidden;opacity:0;transition:opacity 160ms ease-out;}#terminal-input {position:absolute;top:0;left:0;width:1px;height:1px;padding:0;border:0;margin:0;opacity:0;resize:none;overflow:hidden;pointer-events:none;background:transparent;color:transparent;caret-color:transparent;}.row {position:relative;white-space:pre;height:var(--cell-height,19px);line-height:var(--cell-height,19px);}.cell-run {display:inline;white-space:pre;}#cursor {position:absolute;display:none;pointer-events:none;box-sizing:border-box;width:var(--cell-width,8px);height:var(--cell-height,19px);border:1px solid rgba(255,255,255,0.78);background:rgba(255,255,255,0.18);}@keyframes boot-sweep {from {transform:translateX(-100%);}to {transform:translateX(100%);}}@keyframes boot-progress {from {transform:translateX(-140%);}to {transform:translateX(330%);}}@keyframes boot-blip {0%,100% {opacity:0.35;transform:scale(0.92);}45% {opacity:1;transform:scale(1.1);}}@keyframes boot-ledger {0%,100% {opacity:0.44;}50% {opacity:1;}}</style></head><body><div id="terminal-shell" data-state="booting"><div id="boot-screen" role="status" aria-live="polite"><div id="boot-panel"><div id="boot-badge">Emunix firmware monitor</div><div id="boot-title-row"><div id="boot-title">Booting</div><div id="boot-blips" aria-hidden="true"><span class="boot-blip"></span><span class="boot-blip"></span><span class="boot-blip"></span></div></div><div id="boot-progress" aria-hidden="true"><span id="boot-progress-bar"></span></div><div id="boot-ledger" aria-hidden="true"><div class="boot-ledger-line">mounting root filesystem</div><div class="boot-ledger-line">probing terminal hardware</div><div class="boot-ledger-line">warming WebAssembly runtime</div></div><div id="boot-status">Loading userspace...</div></div></div><div id="terminal" aria-hidden="true"></div><textarea id="terminal-input" aria-label="Terminal input" autocapitalize="off" autocomplete="off" autocorrect="off" enterkeyhint="enter" inputmode="text" spellcheck="false" ></textarea><div id="cursor"></div></div><script type="module" src="./app.js"></script></body></html>
